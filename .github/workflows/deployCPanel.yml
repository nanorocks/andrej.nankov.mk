name: Deploy production to cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-cpanel-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Trigger cPanel pull and guarded deployment
        uses: pinkasey/cpanel-deploy-action@5165cf7b6c553654ce1efba26cc8ed20e1ea47d8 # v1.2.5
        with:
          hostname: https://lu-shared04.cpanelplatform.com
          cPanelApiPort: 2083
          cpanel_username: nankovmk
          cpanel_token: ${{ secrets.CPANEL_TOKEN }}
          repository_root: /home/nankovmk/public_html/cicd_projects/nankov.mk
          updateRepository: true
          branch: main
